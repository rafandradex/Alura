<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/culturama-favico.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">
    <title>Pesquisa culturama</title>
</head>

<body>
    <main>
        <header>
            <img src="img/logo-culturama.png" alt="Logo Culturama">
            <h1>Pesquisa Online</h1>
        </header>
        <section>
            <form action="sucesso.html" method="get">
                <!-- DADOS PESSOAIS -->
                <fieldset>
                    <legend>Dados Pessoais</legend>
                    <label for="userName">Nome</label>
                    <input id="userName" type="text" name="userName" required>
                    <br>
                    <label for="userAge">Idade</label>
                    <input id="userAge" type="number" name="userAge" min="12" max="100" required>
                    <br>
                    <label for="birthDate">Data de nascimento</label>
                    <input id="birthDate" type="date" name="birthDate">
                    <br>
                    <label for="userEmail">Email</label>
                    <input id="userEmail" type="email" name="userEmail" required>
                    <br>
                    <label for="userPhoneNumber">Telefone</label>
                    <input id="userPhoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{9}" placeholder="Numero de Telefone" aria-describedby="phoneHelp">
                    <small id="phoneHelp" >Preencha com 9 digitos sem espaços.</small>
                    <br>
                    <label for="userImage">Upload de Foto</label>
                    <input id="userImage" type="file" accept="image/*" name="userImage" aria-describedby="imageHelp">
                    <small id="imageHelp">Envie uma foto no formato PNG ou JPEG</small>
                    <br>
                </fieldset>
                <fieldset>
                    <legend>Perfil</legend>
                    <p>Gênero:</p>
                    <input id="fem" type="radio" name="userGender" value="Masculino">
                    <label for="fem">Masculino</label>
                    <input id="mas" type="radio" name="userGender" value="Feminino">
                    <label for="mas">Feminino</label>
                    <br>
                    <label for="maritalStatus">Estado Civil</label>
                    <select id="maritalStatus" name="maritalStatus">
                        <option value="notInformed">Selecione...</option>
                        <option value="casado">Casado</option>
                        <option value="solteiro">Solteiro</option>
                        <option value="divorciado">Divorciado</option>
                        <option value="viuvo">Viuvo</option>
                    </select>
                    <br>
                    <label for="userDistrict">Distrito</label>
                    <select id="userDistrict" name="userDistrict" required>
                        <option value="aveiro">Aveiro</option>
                        <option value="beja">Beja</option>
                        <option value="braga">Braga</option>
                        <option value="bragança">Bragança</option>
                        <option value="castelobranco">Castelo Branco</option>
                        <option value="coimbra">Coimbra</option>
                        <option value="evora">Évora</option>
                        <option value="faro">Faro</option>
                        <option value="guarda">Guarda</option>
                        <option value="leiria">Leiria</option>
                        <option value="lisboa">Lisboa</option>
                        <option value="portalegre">Portalegre</option>
                        <option value="porto">Porto</option>
                        <option value="madeira">Região Autónoma da Madeira</option>
                        <option value="acores">Região Autónoma dos Açores</option>
                        <option value="santarem">Santarém</option>
                        <option value="setubal">Setúbal</option>
                        <option value="vianadocastelo">Viana do Castelo</option>
                        <option value="vilareal">Vila Real</option>
                        <option value="viseu">Viseu</option>
                    </select>
                    <br>
                    <label for="userCity">Cidade</label>
                    <input id="userCity" type="text" name="userCity">
                </fieldset>
                <fieldset>
                    <legend>Hábitos</legend>
                    <p>Redes Sociais:</p>
                    <input id="ins" type="checkbox" name="social" value="instagram">
                    <label for="ins">Instagram</label>
                    <br>
                    <input id="fac" type="checkbox" name="social" value="facebook">
                    <label for="fac">Facebook</label>
                    <br>
                    <input id="x" type="checkbox" name="social" value="x">
                    <label for="x">X</label>
                    <br>

                    <label for="musicStyle">Estilo de Musica</label>
                    <input list="styleTypes" id="musicStyle" type="text" name="musicStyle">
                    <datalist id="styleTypes">
                        <option value="Rock">
                        <option value="Gospel">
                        <option value="Jazz">
                    </datalist>
                    <br>
                    <label for="favoriteColor">Cor Favorita</label>
                    <input type="color" name="favoriteColor" id="favoriteColor">
                </fieldset>
                <fieldset>
                    <legend>Opinião</legend>
                    <p>Escala de satisfação:</p>
                    <input id="ot" type="radio" name="satisfactionScale" value="otima">
                    <label for="ot">Ótima</label>
                    <input id="bo" type="radio" name="satisfactionScale" value="boa">
                    <label for="bo">Boa</label>
                    <input id="re" type="radio" name="satisfactionScale" value="regular">
                    <label for="re">Regular</label>
                    <input id="ru" type="radio" name="satisfactionScale" value="ruim">
                    <label for="ru">Ruim</label>
                    <br>
                    <label for="comment">Comentario</label>
                    <textarea name="comment" id="comment"></textarea>
                </fieldset>

                <fieldset>
                    <legend>Confirmações</legend>

                    <input type="checkbox" name="userLgpd" id="userLgpd" value="confirmed" required>
                    <label for="userLgpd">Eu aceito participar da pesquisa</label>
                    <br>
                    <input type="checkbox" name="userGetResult" id="userGetResult" value="confirmed">
                    <label for="userGetResult">Desejo receber o resultado por email</label>
                </fieldset>

                <button type="submit" aria-label="Enviar dados do formulário">Enviar</button>
                <button type="reset" aria-label="Limpar dados do formulário">Limpar</button>
            </form>
        </section>
    </main>
</body>

</html>
